ion accuracy.","Built reproducible data preparation and evaluation workflows aligned with industry standards from AICTE and Siemens."],skills_applied:["Data Engineering Fundamentals","Machine Learning","Applied AI","Python","Pandas","NumPy","Data Preprocessing","Feature Engineering","Model Evaluation"],certificate_url:rn}],projects:[{id:1,slug:"clinical-risk-patient-outcome-intelligence-system",title:"Clinical Risk & Patient Outcome Intelligence System",subtitle:"ML / MLOps / Explainable AI (SHAP) / Agentic AI Platform",category:"MLOps & Agentic AI",short_description:"An AI-powered clinical risk prediction and patient outcome intelligence platform focused on predicting 30-day hospital readmission with SHAP explainability, MLflow tracking, FastAPI serving, PostgreSQL audit logging, Prometheus metrics, and a tool-calling LLM agent.",overview:"Engineered an end-to-end 30-day hospital readmission predictor on a 5,000-record synthetic clinical dataset (30 features) with data validation and feature engineering, and integrated an LLM agent that calls the trained model through tools (predict, explain, high-risk patients, factors). Benchmarked Logistic Regression, Random Forest, and Gradient Boosting, auto-selecting the best by ROC-AUC with MLflow tracking; added SHAP explanations and deployed an API-key-secured FastAPI service with PostgreSQL audit logs, Prometheus metrics, a Plotly dashboard, Docker Compose, and automated tests.",problem_statement:"Hospital readmission risk models often operate as opaque black boxes disconnected from operational workflows. Care teams need accurate 30-day readmission probability estimates paired with transparent patient-level feature attributions (why a specific patient is flagged high-risk), full auditability of predictions, and an interactive way to query high-risk cohorts and risk factors.",proposed_solution:"Architected a full-lifecycle MLOps and Agentic AI platform where deterministic machine learning models handle risk estimation and SHAP computes local/global feature attributions, while a Groq-powered tool-calling agent invokes structured tools (predict_patient, explain_patient, high_risk_patients, readmission_factors, dataset_summary) to answer natural-language clinical queries grounded strictly in model outputs.",architecture_nodes:[{id:"data",label:"5,000-Record Synthetic Clinical Dataset",sublabel:"30 Features • Validation & EDA",layer:"Ingestion"},{id:"fe",label:"Feature Engineering & Preprocessing",sublabel:"Imputation • Scaling • Encoding",layer:"Pipeline"},{id:"train",label:"Multi-Model Benchmarking",sublabel:"LogReg • Random Forest • GradBoost",layer:"Modeling"},{id:"mlflow",label:"MLflow Registry & SHAP Engine",sublabel:"ROC-AUC Selection • Feature Attribution",layer:"Explainability & MLOps"},{id:"fastapi",label:"API-Key-Secured FastAPI Service",sublabel:"REST Endpoints • Prometheus /metrics",layer:"Serving"},{id:"agent",label:"Groq Tool-Calling Clinical Agent",sublabel:"predict • explain • high_risk • factors",layer:"Agentic Layer"},{id:"db",label:"PostgreSQL / SQLAlchemy Audit Log",sublabel:"Prediction & Agent Event Persistence",layer:"Storage"},{id:"ui",label:"Streamlit + Plotly Intelligence UI",sublabel:"Cohort Analytics & Patient Explanations",layer:"Interface"}],architecture_edges:[{source:"data",target:"fe",label:"Validated Schema"},{source:"fe",target:"train",label:"30 Engineered Features"},{source:"train",target:"mlflow",label:"Best ROC-AUC Model"},{source:"mlflow",target:"fastapi",label:"Model + SHAP Explainer"},{source:"fastapi",target:"agent",label:"Structured Tools"},{source:"fastapi",target:"db",label:"Audit Events"},{source:"fastapi",target:"ui",label:"Predictions & Metrics"}],technical_workflow:["Data Ingestion & Validation: Validates the 5,000-row, 30-feature synthetic clinical dataset for schema integrity, realistic correlations, and missing values.","Feature Engineering & Benchmarking: Trains Logistic Regression, Random Forest, and Gradient Boosting pipelines, logging metrics to MLflow and auto-selecting the best estimator by ROC-AUC.","SHAP Explainability Generation: Computes local patient-level SHAP values and global readmission risk factors from the serialized estimator.","Secured FastAPI & Observability: Serves predictions and explanations behind API-key authentication, logs every inference and agent invocation via SQLAlchemy (PostgreSQL/SQLite), and exposes Prometheus metrics at /metrics.","Agentic Tool Orchestration: Routes natural-language questions through Groq LLM tool calling (with a deterministic local fallback when offline) and visualizes cohorts in a Plotly + Streamlit dashboard."],tech_stack:["Python","Scikit-learn","SHAP","MLflow","FastAPI","SQLAlchemy","PostgreSQL","Groq","Streamlit","Plotly","Prometheus","Docker","Pytest"],key_features:["Machine learning model benchmarking across Logistic Regression, Random Forest, and Gradient Boosting with automatic ROC-AUC selection","SHAP explainability providing patient-specific risk explanations and global readmission factors","LLM-powered patient analysis using deterministic agent tool calling (predict_patient, explain_patient, high_risk_patients, readmission_factors)","MLflow experiment tracking and model registry metadata persistence","API-key-secured FastAPI inference endpoints with Prometheus monitoring (/metrics)","PostgreSQL / SQLAlchemy audit logging for both ML predictions and AI agent executions","Interactive Plotly + Streamlit dashboard, Docker Compose orchestration, and Pytest automated testing"],implementation_details:["Separated ML inference from LLM communication: the agent never fabricates risk numbers; it invokes trained model tools and synthesizes the returned structured JSON.","Implemented a deterministic agent fallback so the system remains 100% functional even without an external GROQ_API_KEY.","Designed SQLAlchemy models supporting seamless switching between SQLite for instant local execution and PostgreSQL via DATABASE_URL in Docker Compose."],challenges:["Preventing LLM hallucination on quantitative clinical risk scores — solved by enforcing strict tool calling where numerical predictions and SHAP attributions come exclusively from the serialized Scikit-learn/SHAP pipeline.","Maintaining low-latency SHAP explanations during interactive API requests — solved by caching the loaded model and explainer artifacts in the FastAPI service layer."],future_improvements:["Add data drift and prediction distribution monitoring over rolling time windows.","Integrate survival analysis (time-to-readmission) alongside binary 30-day classification.","Add role-based access control and cohort export pipelines."],github_url:"https://github.com/saurav526/Clinical-Risk-Patient-Outcome-Intelligence-System",disclaimer:"Educational & Engineering Demonstration: Uses a 100% synthetic clinical dataset. Not intended for clinical diagnosis or medical decision-making.",accent_color:"#8b5cf6",featured:!0,display_order:1},{id:2,slug:"opspilot-ai-incident-intelligence-copilot",title:"OpsPilot AI — Incident Intelligence Copilot",subtitle:"Anomaly Detection / TF-IDF Runbook RAG / Tool-Using Agent",category:"AIOps & Incident RAG",short_description:"An AI-assisted incident investigation platform that combines Isolation Forest anomaly detection, TF-IDF cosine-similarity runbook retrieval, and a tool-using investigation agent with FastAPI, Streamlit, and SQLite audit logging.",overview:"Developed an incident copilot that detects unusual service metrics with Isolation Forest, retrieves runbooks via TF-IDF/cosine similarity, and orchestrates a tool-using agent (optional Groq LLM) to recommend read-only investigation steps. Shipped a REST API (anomalies, investigate, audit endpoints) with request validation, a Streamlit dashboard, SQLite audit logging, Pytest tests, and a no-LLM fallback so it runs without an API key.",problem_statement:"During service degradation or latency spikes, operational context is scattered across raw telemetry streams and markdown runbooks. On-call engineers spend critical time manually correlating anomalous metrics with troubleshooting guides before knowing which safe diagnostic checks to execute first.",proposed_solution:"Built OpsPilot AI to unify statistical anomaly detection and runbook retrieval behind a single investigation workflow. Isolation Forest ranks unusual service metric vectors, TF-IDF retrieval surfaces matching operational runbook procedures, and an agent combines both evidence sources into structured, audited, read-only investigation plans.",architecture_nodes:[{id:"telemetry",label:"Service Telemetry Stream",sublabel:"Latency • Error Rate • CPU • Throughput",layer:"Telemetry"},{id:"iforest",label:"StandardScaler + Isolation Forest",sublabel:"Unsupervised Anomaly Scoring",layer:"Detection"},{id:"runbooks",label:"Operational Runbook Corpus",sublabel:"TF-IDF Vectorizer + Cosine Similarity",layer:"Retrieval (RAG)"},{id:"agent",label:"Incident Investigation Agent",sublabel:"Groq LLM + Deterministic Local Fallback",layer:"Agentic Orchestration"},{id:"api",label:"FastAPI REST Service",sublabel:"/anomalies • /investigate • /audit/recent",layer:"API Layer"},{id:"sqlite",label:"SQLite Audit Logger",sublabel:"Immutable Investigation Trace",layer:"Persistence"},{id:"dashboard",label:"Streamlit Ops Dashboard",sublabel:"Anomaly Ranking & Interactive Copilot",layer:"UI"}],architecture_edges:[{source:"telemetry",target:"iforest",label:"Metric Vectors"},{source:"iforest",target:"agent",label:"Top Anomalies"},{source:"runbooks",target:"agent",label:"Top-K Runbooks"},{source:"agent",target:"api",label:"Investigation Plan"},{source:"api",target:"sqlite",label:"Audit Log Entry"},{source:"api",target:"dashboard",label:"REST JSON"}],technical_workflow:["Telemetry Ingestion & Scaling: Loads multi-service operational metrics and normalizes feature distributions with StandardScaler.","Unsupervised Anomaly Detection: Trains an Isolation Forest model (scripts/train.py) to score and rank anomalous service intervals.","Runbook Retrieval (RAG): Indexes operational runbooks using TF-IDF and ranks relevant troubleshooting sections via cosine similarity.","Tool-Using Investigation Agent: Combines service summaries, anomaly scores, and retrieved runbook passages to synthesize read-only diagnostic steps (using Groq LLM when configured or deterministic local synthesis).","REST API & Audit Persistence: Exposes validated FastAPI endpoints (/health, /metrics/summary, /anomalies, /investigate, /audit/recent) and records every investigation in SQLite."],tech_stack:["Python","Scikit-learn","Isolation Forest","TF-IDF","FastAPI","Streamlit","SQLite","Groq","Pytest"],key_features:["Isolation Forest anomaly detection ranking unusual multi-metric service intervals","TF-IDF-based runbook retrieval using cosine similarity ranking","Tool-using AI agent correlating telemetry anomalies with operational runbooks","Optional Groq LLM integration paired with deterministic no-LLM fallback functionality","Strictly read-only incident investigation steps for operational safety","FastAPI REST API (/anomalies, /investigate, /audit) and interactive Streamlit dashboard","SQLite audit logging and Pytest automated test suite"],implementation_details:["Modularized into clean packages: src/data.py, src/model.py, src/rag.py, src/agent.py, src/db.py, api/main.py, and app/streamlit_app.py.","Designed deterministic fallback synthesis so automated tests (pytest -q) and local demos succeed without requiring external API keys."],challenges:["Correlating quantitative anomaly scores with textual runbooks — solved by passing structured service context and anomaly metadata into the retrieval query builder.","Ensuring operational safety — constrained agent output strictly to read-only verification steps and logged every query to SQLite."],future_improvements:["Upgrade lexical TF-IDF retrieval to hybrid dense + sparse embeddings for broader runbook phrasing coverage.","Add human-in-the-loop approval gates and webhook notifications for PagerDuty/Slack."],github_url:"https://github.com/saurav526/OpsPilot_AI_Incident_Intelligence",disclaimer:"Uses synthetic service telemetry and executes strictly read-only investigation steps.",accent_color:"#06b6d4",featured:!0,display_order:2},{id:3,slug:"autonomous-cyber-defense-system",title:"Autonomous Cyber Defense System",subtitle:"Graph Neural Networks / Graph Autoencoder / Reinforcement Learning",category:"Graph ML & Cyber AI",short_description:"An intelligent cybersecurity system that analyzes synthetic network telemetry as graphs, flags anomalies via a self-supervised graph autoencoder, and selects graduated response actions using reinforcement learning.",overview:"Simulated a defensive ML environment by synthesizing network telemetry and modeling traffic as graphs with node- and edge-level features to separate normal from malicious behavior. Trained a self-supervised graph autoencoder that flags anomalies by reconstruction error, and implemented a reinforcement-learning policy that selects monitor, rate-limit, isolate, or block actions by threat severity.",problem_statement:"Traditional signature-based intrusion detection struggles to identify novel lateral movement and coordinated network anomalies because it inspects packets in isolation rather than capturing topological relationships across communicating nodes.",proposed_solution:"Represented network telemetry as an attributed graph with normalized neighborhood aggregation, trained a self-supervised graph autoencoder on normal traffic patterns to flag high reconstruction-error anomalies, and coupled it with a reinforcement-learning policy engine that maps threat severity to graduated defensive actions.",architecture_nodes:[{id:"net",label:"Synthetic Network Telemetry",sublabel:"Flows • Packets • Node & Edge Attributes",layer:"Simulation"},{id:"graph",label:"Graph Construction & Aggregation",sublabel:"Normalized Neighborhood Representation",layer:"Graph Layer"},{id:"gae",label:"Self-Supervised Graph Autoencoder",sublabel:"Latent Encoding & Reconstruction",layer:"Deep Learning"},{id:"err",label:"Reconstruction Error Thresholding",sublabel:"Node & Edge Anomaly Scoring",layer:"Detection"},{id:"rl",label:"Reinforcement Learning Policy",sublabel:"Severity-Aware Action Selection",layer:"Decision Engine"},{id:"act",label:"Graduated Defensive Response",sublabel:"Monitor • Rate-Limit • Isolate • Block",layer:"Response & UI"}],architecture_edges:[{source:"net",target:"graph",label:"Host/Flow Topology"},{source:"graph",target:"gae",label:"Aggregated Features"},{source:"gae",target:"err",label:"Reconstruction Error"},{source:"err",target:"rl",label:"Threat Severity State"},{source:"rl",target:"act",label:"Optimal Defense Policy"}],technical_workflow:["Synthetic Telemetry Generation: Simulates normal background traffic alongside injected attack patterns with node- and edge-level telemetry attributes.","Graph Construction & Neighborhood Aggregation: Builds communication graphs and computes normalized neighborhood feature representations.","Self-Supervised Graph Autoencoder: Learns compressed latent representations of normal network topology and reconstructs node/edge features.","Reconstruction-Error Anomaly Detection: Computes per-node reconstruction residuals and flags traffic exceeding calibrated anomaly thresholds.","Reinforcement Learning Response Policy: Evaluates anomaly severity and selects between Monitor, Rate-limit, Isolate, or Block actions in an interactive Streamlit dashboard with CSV export."],tech_stack:["Python","Graph Neural Networks","Autoencoders","Reinforcement Learning","Streamlit"],key_features:["Synthetic network telemetry generation modeling multi-node traffic flows","Graph-based representation of network activity with node and edge features","Normalized neighborhood aggregation and self-supervised graph autoencoder","Reconstruction-error-based anomaly detection separating normal and malicious traffic","Reinforcement learning-based response policy selecting Monitor, Rate-Limit, Isolate, or Block actions based on severity","Interactive Streamlit dashboard with graph telemetry visualization and CSV export"],implementation_details:["Implemented end-to-end pipeline from graph adjacency normalization to autoencoder reconstruction scoring and RL policy evaluation.","Provided interactive threshold tuning and policy inspection inside Streamlit."],challenges:["Balancing false-positive containment actions against severe threats — addressed by designing a graduated 4-tier RL action space (Monitor -> Rate-limit -> Isolate -> Block) proportional to reconstruction error severity."],future_improvements:["Evaluate temporal graph networks (TGN) over streaming packet captures.","Benchmark against public intrusion datasets such as CIC-IDS and UNSW-NB15."],github_url:"https://github.com/saurav526/autonomous_cyber_defense",disclaimer:"Educational defensive simulation using synthetic network traffic; response actions do not modify real network infrastructure.",accent_color:"#a855f7",featured:!0,display_order:3},{id:4,slug:"ai-medical-chatbot",title:"AI Medical Chatbot",subtitle:"Generative AI / Retrieval-Augmented Generation (RAG) / FAISS",category:"Generative AI & RAG",short_description:"A conversational AI system using Retrieval-Augmented Generation (RAG), semantic chunking, vector embeddings, FAISS similarity search, and LangChain conversational memory to answer questions from medical knowledge documents.",overview:"Built a context-aware medical chatbot with LangChain and Hugging Face LLMs, leveraging semantic chunking, embedding retrieval, and conversational memory for multi-turn queries. Architected a RAG pipeline with FAISS search, cosine-similarity ranking, and custom prompts to ground answers in medical knowledge and reduce hallucinations.",problem_statement:"General-purpose LLMs can hallucinate or provide unverified claims when asked domain-specific medical reference questions, and stateless single-turn Q&A fails to preserve context across follow-up questions.",proposed_solution:"Architected a Retrieval-Augmented Generation (RAG) pipeline that ingests reference medical documents, splits them into semantic chunks, indexes vector embeddings in FAISS for fast cosine-similarity retrieval, and uses LangChain with custom grounding prompts and conversational memory.",architecture_nodes:[{id:"docs",label:"Medical Knowledge Documents",sublabel:"Reference PDF / Text Corpus",layer:"Knowledge Base"},{id:"chunk",label:"Document Ingestion & Semantic Chunking",sublabel:"Context-Preserving Text Splits",layer:"Preprocessing"},{id:"embed",label:"Hugging Face Vector Embeddings",sublabel:"Dense Semantic Representations",layer:"Embedding"},{id:"faiss",label:"FAISS Vector Database",sublabel:"Cosine-Similarity Top-K Search",layer:"Vector Store"},{id:"memory",label:"LangChain Conversational Memory",sublabel:"Multi-Turn Context Window",layer:"Orchestration"},{id:"llm",label:"Grounded LLM Answer Generation",sublabel:"Custom Anti-Hallucination Prompts",layer:"Generation"}],architecture_edges:[{source:"docs",target:"chunk",label:"Raw Documents"},{source:"chunk",target:"embed",label:"Semantic Chunks"},{source:"embed",target:"faiss",label:"Dense Vectors"},{source:"faiss",target:"memory",label:"Top-K Context"},{source:"memory",target:"llm",label:"Prompt + History"}],technical_workflow:["Document Ingestion & Semantic Chunking: Loads reference medical documents and segments them into overlapping semantic chunks to preserve clinical context.","Vector Embedding Generation: Encodes document chunks and user queries into dense vector representations using Hugging Face embedding models.","FAISS Vector Indexing & Retrieval: Stores embeddings in a FAISS index and retrieves the highest-ranking passages via cosine similarity.","Conversational Memory & Prompt Engineering: Combines multi-turn conversation history with retrieved passages inside a custom LangChain prompt template that enforces grounded responses.","Grounded Answer Synthesis: Generates cited, context-aware answers while declining out-of-scope claims."],tech_stack:["Python","LangChain","FAISS","Hugging Face","Vector Embeddings","Prompt Engineering"],key_features:["Document ingestion and semantic chunking pipeline preserving medical reference context","Dense vector embeddings generated via Hugging Face models","FAISS vector database indexing with cosine similarity retrieval","LangChain integration with conversational memory for multi-turn dialogue","Custom prompt engineering for grounded answer generation and hallucination reduction"],implementation_details:["Configured chunk size and overlap parameters to keep symptom, etiology, and reference descriptions intact within retrieved passages.","Designed strict system prompts instructing the LLM to rely solely on retrieved FAISS context."],challenges:["Preventing unsupported medical claims when a query falls outside the indexed documents — solved via strict grounding instructions in the prompt template and similarity threshold filtering."],future_improvements:["Add cross-encoder reranking and inline page/paragraph citation badges.","Evaluate RAG triad metrics (context relevance, groundedness, answer relevance)."],github_url:"https://github.com/saurav526/GEN-AI-projects/tree/main/Medical_bot2.0",disclaimer:"IMPORTANT EDUCATIONAL DISCLAIMER: This is an educational AI and RAG engineering project, NOT a clinically validated diagnostic tool or substitute for professional medical advice.",accent_color:"#10b981",featured:!0,display_order:4},{id:5,slug:"expense-tracker-mcp-server",title:"Expense Tracker MCP Server",subtitle:"Model Context Protocol (MCP) / FastMCP / LLM Tool Integration",category:"MCP & Agent Tooling",short_description:"A Model Context Protocol (MCP) server built with FastMCP and SQLite that exposes expense management tools and a live-editable categories resource to compatible AI clients.",overview:"Developed a FastMCP server that lets an AI assista
